<style>
/* Layout: one column. Top: file loader + sound status. Middle: tappable lines grouped by page. Bottom: sticky player. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b1f2a; --muted: #646b7c; --line: #e1e4ea;
  --blue: #0b4ea2; --red: #c8303f; --active: #e8effa; --ok: #1f8a5c;
  --display: "Gowun Batang", Georgia, serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --surface: #1b1e27; --fg: #e9ebf1; --muted: #9aa1b2; --line: #2b2f3b;
    --blue: #7fa9ec; --red: #ef6f7c; --active: #1f2a40; --ok: #4cc493; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1b1e27; --fg: #e9ebf1; --muted: #9aa1b2; --line: #2b2f3b;
  --blue: #7fa9ec; --red: #ef6f7c; --active: #1f2a40; --ok: #4cc493; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.55; font-size: 16px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 230px; }
h1 { font-family: var(--display); font-size: 1.9rem; margin: 0; color: var(--blue); }
.sub { margin: 4px 0 18px; color: var(--muted); font-size: 1rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-weight: 600; font-size: 1rem; border: 0; border-radius: 12px; padding: 13px 16px; min-height: 48px; background: var(--blue); color: #fff; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.stop { background: var(--red); }
.file { font-size: .95rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.status { font-size: .95rem; display: flex; gap: 8px; align-items: flex-start; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; margin-top: 6px; }
.status.good .dot { background: var(--ok); }
.status.bad .dot { background: var(--red); }
.status.bad { color: var(--red); }
textarea { font: inherit; width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--fg); resize: vertical; }
details summary { cursor: pointer; font-size: .85rem; color: var(--muted); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
.chip { font: inherit; font-size: .95rem; min-height: 42px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.page { font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.ln { display: grid; grid-template-columns: 52px 1fr; align-items: stretch; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.ln.playing { border-color: var(--blue); background: var(--active); box-shadow: 0 0 0 2px var(--blue); }
.ln.sel { border-color: var(--red); }
.pick { border: 0; border-right: 1px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); font-size: 1.3rem; }
.ln.sel .pick { color: #fff; background: var(--red); font-weight: 700; }
.ln.sel { background: var(--active); }
.txt { font: inherit; text-align: left; border: 0; background: transparent; color: inherit; padding: 12px 14px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; font-size: 1rem; }
.txt .k { font-weight: 600; font-size: 1.25rem; }
.txt .o { color: var(--muted); font-size: .95rem; }
.hide .txt .k .w:not(.shown) { filter: blur(6px); background: color-mix(in srgb, var(--blue) 18%, transparent); border-radius: 6px; cursor: pointer; }
.hide .txt .k .w.shown { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: none; opacity: 1; } }
.hidehint { font-size: .9rem; color: var(--muted); margin: -4px 0 10px; }
.empty { color: var(--muted); font-size: .9rem; padding: 20px 0; }

.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.pin { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.speeds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sp { font: inherit; font-size: .95rem; font-weight: 600; min-height: 44px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.sp small { font-weight: 400; font-size: .7rem; color: var(--muted); }
.sp[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.sp[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
.lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
.pin .row .btn { flex: 1 1 130px; }
.ctrl { display: flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--fg); min-height: 40px; }
.ctrl input[type=checkbox] { width: 22px; height: 22px; }
.ctrl input[type=range] { width: 100px; }
.rv { font-variant-numeric: tabular-nums; min-width: 2.6em; }
select { font: inherit; font-size: .95rem; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; background: var(--surface); color: var(--fg); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 14px; }
.mode { font: inherit; font-weight: 600; font-size: 1rem; min-height: 46px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.mode[aria-selected="true"] { background: var(--blue); color: #fff; }
.qbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .95rem; color: var(--muted); }
.qbar b { color: var(--fg); font-variant-numeric: tabular-nums; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--blue); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qhead { font-size: 1rem; font-weight: 600; }
.ctx { font-size: 1.2rem; line-height: 1.7; overflow-wrap: anywhere; }
.ctx .gap { display: inline-block; min-width: 3.5em; border-bottom: 3px solid var(--blue); margin: 0 2px; }
.ctx .o { color: var(--muted); font-size: .95rem; }
.listen { align-self: flex-start; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { font: inherit; font-size: 1.45rem; font-weight: 600; min-height: 64px; padding: 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.opt .n { font-size: .8rem; font-weight: 600; color: var(--muted); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--bg)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--bg)); }
.opt:disabled { cursor: default; }
.fb { font-size: 1rem; font-weight: 600; min-height: 1.5em; }
.fb.good { color: var(--ok); } .fb.bad { color: var(--red); }
.qset { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.result { text-align: center; padding: 10px 0; }
.result .big { font-family: var(--display); font-size: 2.6rem; color: var(--blue); }
.miss { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
.miss span, .miss button { font: inherit; color: inherit; border: 0; font-size: 1.15rem; font-weight: 600; padding: 4px 12px; border-radius: 8px; background: color-mix(in srgb, var(--red) 14%, var(--bg)); }
.miss button { cursor: pointer; }
.hint { font-size: .9rem; color: var(--muted); }
@media (max-width: 360px) { .opts { grid-template-columns: 1fr; } }
.gtrow { font-size: .9rem; color: var(--muted); }
.gtrow a { color: var(--blue); font-weight: 600; }
.w { border-radius: 4px; transition: background .12s, color .12s; }
.w.now { background: var(--blue); color: #fff; box-shadow: 0 0 0 3px var(--blue); }
.hide .txt .k .w.now { filter: none; }
.modes { grid-template-columns: repeat(3, 1fr); }
.mode { font-size: .95rem; }
.opage { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.opage canvas { width: 100%; height: auto; border-radius: 6px; background: #fff; display: block; }
.opage .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); font-weight: 600; }
.otext { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.05rem; line-height: 1.7; }
.otext.html { white-space: normal; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.gear { font: inherit; font-size: 1rem; font-weight: 600; min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; flex: 0 0 auto; }
.vstat { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
.vpill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: .85rem; }
.vpill.ok { color: var(--ok); border-color: var(--ok); }
.vpill.no { color: var(--red); border-color: var(--red); }
.vpill.off { color: var(--muted); }
.linkbtn { font: inherit; font-size: .9rem; background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; padding: 4px 2px; text-decoration: underline; }
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; }
.sheet-in { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-family: var(--display); font-size: 1.6rem; margin: 0; color: var(--blue); }
.sheet h3 { font-size: 1.05rem; margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { font: inherit; font-weight: 600; font-size: 1rem; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.lang { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.lang-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lang-h label { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; }
.lang-h input { width: 24px; height: 24px; }
.lang select { width: 100%; }
.steps { margin: 6px 0 0; padding-left: 20px; font-size: .92rem; display: flex; flex-direction: column; gap: 4px; }
.steps b { font-weight: 600; }
.os { font-size: .85rem; font-weight: 600; color: var(--muted); margin-top: 8px; }
.trl { display: flex; gap: 8px; align-items: baseline; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--fg); font-size: .95rem; line-height: 1.45; cursor: pointer; }
.trl .tag { flex: 0 0 auto; font-size: .7rem; font-weight: 700; letter-spacing: .06em; color: var(--red); border: 1px solid var(--red); border-radius: 5px; padding: 0 5px; }
.trl.playing { color: var(--blue); }
.notr .trl { display: none; }
.ln { grid-template-columns: 52px 1fr auto; }
.tre { border: 0; border-left: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0 10px; }
.hdtag { display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-right: 8px; vertical-align: 2px; }
.tredit { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; border-top: 1px dashed var(--line); }
.tredit textarea { font: inherit; font-size: 1rem; width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); resize: vertical; }
.hidetr .trl > span:last-child { filter: blur(5px); }
.ln.peek .trl > span:last-child { filter: none; }
.opage canvas, .opage .otext { cursor: zoom-in; }
.viewer[hidden] { display: none; }
.viewer { position: fixed; inset: 0; z-index: 40; background: #0d0f14; color: #e9ebf1; display: flex; flex-direction: column; }
.vbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: #161922; }
.vbar .vt { font-weight: 600; font-variant-numeric: tabular-nums; }
.vb { font: inherit; font-weight: 600; font-size: 1rem; min-width: 46px; min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #2b2f3b; background: #1f2330; color: #e9ebf1; cursor: pointer; }
.vb:disabled { opacity: .35; cursor: default; }
.vbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; display: grid; place-items: start center; }
.vbody canvas { display: block; background: #fff; }
.vbody .otext { margin: 12px; max-width: 760px; background: #1b1e27; color: #e9ebf1; border-color: #2b2f3b; font-size: 1.25rem; cursor: default; }
.vfoot { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: #161922; }
.vzoom { min-width: 3.5em; text-align: center; font-variant-numeric: tabular-nums; }
/* tablets and computers: wider column, bigger type, pages side by side */
@media (min-width: 760px) {
  body { font-size: 17px; }
  .wrap { max-width: 860px; padding-block: 32px 200px; }
  .pin, .sheet-in { max-width: 860px; }
  h1 { font-size: 2.3rem; }
  .txt .k { font-size: 1.4rem; }
  .ln { grid-template-columns: 60px 1fr; }
  .pin { display: grid; grid-template-columns: 1fr 1fr; align-items: center; column-gap: 20px; }
  .pin .gtrow, .pin .lbl, .pin > .row:not(:last-child) { grid-column: 1 / -1; }
  .pin > .row:not(:last-child) .btn { flex: 0 1 260px; }
  .pin .lbl { display: none; }
  .pin .speeds { grid-row: 3; grid-column: 1; }
  .pin > .row:last-child { grid-row: 3; grid-column: 2; justify-content: flex-end; }
  .qcard { max-width: 680px; margin: 0 auto; width: 100%; }
  #qStart { max-width: 680px; margin-left: auto; margin-right: auto; }
  .opt { font-size: 1.7rem; min-height: 76px; }
}
@media (min-width: 1200px) {
  .wrap { max-width: 1180px; }
  .pin, .sheet-in { max-width: 1180px; }
  #listView { max-width: 900px; margin: 0 auto; }
  #orig { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  #orig .opage { margin-bottom: 0; }
  #orig > p { grid-column: 1 / -1; }
  .opts { grid-template-columns: repeat(4, 1fr); }
  .qcard, #qStart { max-width: 820px; }
}
@media (hover: hover) {
  .ln:hover { border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); }
  .btn:hover, .chip:hover, .sp:hover, .mode:hover, .opt:not(:disabled):hover { filter: brightness(1.08); }
}
.pgbox { position: relative; }
.pgbox canvas { display: block; }
.cov { --cover: var(--blue); touch-action: manipulation; }
.cov.pdf { position: absolute; border-radius: 3px; }
.cov.on { background: var(--cover); box-shadow: 0 0 0 1.5px var(--cover); color: transparent; }
.cov.t { border-radius: 4px; }
.covering .cov { cursor: crosshair; touch-action: none; }
.covering .cov:not(.on) { background: color-mix(in srgb, var(--cover) 22%, transparent); outline: 1px dashed color-mix(in srgb, var(--cover) 80%, transparent); }
.cov.peekw { animation: peekw .35s ease-out; }
@keyframes peekw { from { box-shadow: 0 0 0 6px color-mix(in srgb, var(--cover) 60%, transparent); } }
.origbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-start; margin-bottom: 10px; }
.origbar .hint { flex: 1 1 100%; margin: 0; }
.covbtn[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.vb.covbtn[aria-pressed="true"] { background: #0b4ea2; color: #fff; }
.lessonrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lessonrow select { flex: 1 1 200px; min-width: 0; font-size: 1rem; padding: 10px; }
.btn.danger { background: var(--red); }
.btn:disabled { opacity: .4; cursor: default; }
.pseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.pseg button { font: inherit; font-weight: 600; font-size: .95rem; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.pseg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dans { width: 100%; min-height: 76px; font-size: 1.35rem; line-height: 1.5; }
.dgrid { display: flex; flex-wrap: wrap; gap: 8px; }
.dres { display: flex; flex-direction: column; gap: 6px; font-size: 1.25rem; line-height: 1.6; overflow-wrap: anywhere; }
.dres .lbl2 { font-size: .8rem; font-weight: 600; color: var(--muted); }
.dres .ok { color: var(--ok); }
.dres .mz { color: var(--red); text-decoration: underline wavy; text-underline-offset: 4px; }
.dres .extra { color: var(--red); text-decoration: line-through; }
.boxes { font-size: 1.2rem; letter-spacing: .1em; color: var(--muted); }
.sbig { font-size: 1.6rem; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.strl { color: var(--muted); font-size: 1rem; }
.recbtn.on { background: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { filter: brightness(1.25); } }

/* ===== Look: one system of corners, borders, shadows and "selected" colour for the whole app ===== */
:root {
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --soft: color-mix(in srgb, var(--blue) 13%, var(--surface));
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
}
body { margin: 0; }
.wrap { padding-block: 10px 210px; }

/* header: a small flag with "with Subin" under it, settings on the right */
.hdr { justify-content: center; align-items: center; padding: 2px 56px 12px; }
.hdr .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1.1; margin: 0; }
.hdr .flag { width: 46px; margin: 0; border-radius: 3px; }
.withsubin { margin: 0; font-size: .95rem; letter-spacing: .03em; }
.hdr .gear-icon { position: absolute; top: 50%; right: 0; transform: translateY(-50%); margin-top: -5px; width: 44px; height: 44px; min-height: 44px; border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--fg); }
.hdr .gear-icon svg { display: block; }
.hdr + .sub { display: none; }

/* cards */
.panel, .qcard, .opage, .lang, .others, .otext, .ln, .trbar, #qStart, #dStart { border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.trbar, .guide { box-shadow: none; }
.panel { padding: 12px 14px; gap: 10px; }
.lbl { text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; }

/* buttons and fields */
.btn { border-radius: var(--r); min-height: 44px; padding: 10px 16px; font-size: .95rem; }
.btn.ghost { border: 1px solid var(--line); background: var(--surface); }
select, .lessonrow select, #trSel { border-radius: var(--r); min-height: 44px; border: 1px solid var(--line); }
textarea, .tredit textarea { border-radius: var(--r); border-width: 1px; }
#delLesson { width: 44px; padding: 0; flex: 0 0 auto; }
.lessonrow { flex-wrap: nowrap; }
.lessonrow select { flex: 1 1 auto; }
.vstat { font-size: .85rem; color: var(--muted); }
.vpill { font-size: .78rem; padding: 2px 9px; }

/* the three main tabs stay at the top while scrolling */
.modes { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 4px; gap: 4px; border-radius: var(--r-lg); box-shadow: var(--shadow); margin: 2px 0 12px; }
.mode { min-height: 42px; font-size: .9rem; white-space: nowrap; border-radius: var(--r); }

/* option chips: one line that scrolls sideways instead of wrapping */
.chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 38px; padding: 6px 14px; font-size: .9rem; white-space: nowrap; border-width: 1px; }
.orighint { margin: 0 2px 8px; }
.origbar.chips { flex-wrap: nowrap; gap: 6px; }
.opage .otext { border: 0; box-shadow: none; padding: 4px 2px; }

/* covered words in the Original: blurred like "Hide Korean" in Listen, not a solid block */
.cov.on { box-shadow: none; }
.cov.t.on { color: inherit; filter: blur(6px); background: color-mix(in srgb, var(--cover) 18%, transparent); border-radius: 6px; }
.cov.pdf.on { color: transparent; background: color-mix(in srgb, var(--cover) 14%, transparent); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); border-radius: 5px; }

/* one "selected" look everywhere: soft blue with blue text */
.chip[aria-pressed="true"], .covbtn[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--soft); color: var(--blue); border-color: var(--blue); }

/* lesson lines */
.ln { grid-template-columns: 44px 1fr auto; margin-bottom: 10px; border-width: 1px; }
.ln.playing { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); }

.txt { padding: 12px; }
.tre { padding: 0 12px; font-size: .95rem; opacity: .75; }
.tre:hover { opacity: 1; }
.page { margin: 18px 2px 8px; border-bottom: 0; }
.trl .tag { border-radius: 6px; }

/* player: a rounded sheet at the bottom */
.player { border-radius: 18px 18px 0 0; box-shadow: 0 -6px 20px rgba(16, 24, 40, .08); padding-top: 4px; }
.pin { gap: 8px; }

.sp { border: 0; background: transparent; min-height: 40px; border-radius: var(--r-sm); }

/* practice */
.pseg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px; gap: 4px; box-shadow: var(--shadow); }
.pseg button { border: 0; border-radius: var(--r); min-height: 40px; background: transparent; color: var(--muted); }

.lang, .others { border-width: 1px; }

  .ln { grid-template-columns: 52px 1fr auto; }

  .withsubin { font-size: 1.05rem; }
}

<script>
/* Inside the KWS Android app the WebView has no speechSynthesis; the app exposes AndroidTTS instead.
   This shim maps it onto the browser API so the rest of the page works unchanged (with exact word events). */
(function () {
  const A = window.AndroidTTS; if (!A) return;
  let seq = 0, speaking = false, pending = 0; const map = {};
  function Utt(text) { this.text = text || ""; this.lang = ""; this.voice = null; this.rate = 1; this.pitch = 1; this.volume = 1; this.onstart = this.onend = this.onerror = this.onboundary = null; }
  const synth = {
    onvoiceschanged: null, paused: false,
    get speaking() { return speaking || pending > 0; }, get pending() { return pending > 0; },
    getVoices() { try { return JSON.parse(A.voices()).map(v => ({ name: v.name, lang: v.lang, localService: v.localService, voiceURI: v.name, default: false })); } catch (e) { return []; } },
    speak(u) { const id = ++seq; map[id] = u; pending++; A.speak(id, String(u.text), u.lang || "", u.voice ? u.voice.name : "", +u.rate || 1, +u.pitch || 1, u.volume == null ? 1 : +u.volume); },
    cancel() { A.stop(); for (const id in map) { const u = map[id]; delete map[id]; try { u.onerror && u.onerror({ error: "interrupted" }); } catch (e) {} } pending = 0; speaking = false; },
    pause() {}, resume() {},
  };
  window.__ttsEvent = (id, type, a, b) => {
    const u = map[id]; if (!u) return;
    if (type === "start") { if (!u._s) { u._s = 1; pending = Math.max(0, pending - 1); } speaking = true; u.onstart && u.onstart({}); }
    else if (type === "boundary") { u.onboundary && u.onboundary({ name: "word", charIndex: a, charLength: b - a }); }
    else {
      delete map[id]; if (!u._s) pending = Math.max(0, pending - 1); speaking = false;
      if (type === "end") u.onend && u.onend({}); else u.onerror && u.onerror({ error: type === "interrupted" ? "interrupted" : "synthesis-failed" });

const memLessons = new Map();   // lessons opened or added in this session
async function getLesson(id) {

  // the example lesson ships inside the app, so it can always be rebuilt
  if ((!rec || !rec.lines) && id === SAMPLE_ID && SAMPLE.length) rec = { lines: SAMPLE.map(([page, text]) => ({ page, text })), orig: samplePdf() };
  if (!rec || !rec.lines) { const ls = store.get("ln-" + id, null); rec = ls ? { lines: ls, orig: null } : null; }   // text-only backup

async function openLesson(id) {

    const rec = meta ? await getLesson(id) : null;

/* Korean sentences of the lesson: [{i: line index, ko}] */
function sentences(src) {
  const ids = src === "sel" && sel.size ? [...sel].sort((a, b) => a - b) : lines.map((_, i) => i);
  const seen = new Set(), out = [];
  for (const i of ids) {
    if (isHead(lines[i])) continue;
    let ko = (lines[i].text.match(RUN) || []).map(x => x.trim()).join(" ").replace(/\s+/g, " ").trim();
    // drop a speaker label like "수빈:" so only what is said goes into the exercise
    const lab = ko.match(/^[^:：.!?]{1,15}[:：]\s*/);
    if (lab && /[\uAC00-\uD7A3]/.test(ko.slice(lab[0].length))) ko = ko.slice(lab[0].length);
    const norm = ko.replace(/[^가-힣\d]/g, "");
    if (norm.length < 2 || seen.has(norm)) continue;
    seen.add(norm); out.push({ i, ko });
  }
  return src === "review" ? out.filter(x => isDue(prog.s[x.ko])) : out;
}
const normK = x => [...x.replace(/[^가-힣ㄱ-ㆎ\d]/g, "")];
function speakKo(text, r) {
  return new Promise(res => {
    if (!synth) return res();
    const u = utter(text, "ko"); if (r) u.rate = r;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 3000 + text.length * 600);
    speakNow(u);
  });
}

  if (id === "dRetry") startDict(D.items.filter(x => (x.score ?? 0) < 100).map(x => ({ i: x.i, ko: x.ko })));
});
$("dBox").addEventListener("input", e => { if (e.target.id === "dAns" && D) D.items[D.i].ans = e.target.value; });
$("dBox").addEventListener("keydown", e => { if (e.target.id === "dAns" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("dNext").hidden ? checkD() : $("dNext").click(); } });

/* ---------- speaking: record yourself and compare ---------- */
const S = { i: 0 };
const recs = new Map();          // recKey(sentence) -> object URL of the recording
// recordings are also kept in IndexedDB, per lesson, so they survive closing the app
const recKey = ko => `rec:${curId}:${ko}`;
const recTried = new Set();
async function loadRec(ko) {
  const k = recKey(ko);
  if (recs.has(k) || recTried.has(k)) return false;
  recTried.add(k);
  const blob = await idb("readonly", st => st.get(k));
  if (!(blob instanceof Blob)) return false;
  recs.set(k, URL.createObjectURL(blob)); return true;
}
let recState = null;             // {mr, stream, t0, timer}
function renderSpeak(msg) {
  const list = sentences("all");
  if (!list.length) { $("sBox").innerHTML = `<p class="empty">${t("noSent")}</p>`; return; }
  S.i = Math.min(S.i, list.length - 1);
  const it = list[S.i], tr = getTr(lines[it.i]?.text || ""), has = recs.has(recKey(it.ko));
  if (!has) loadRec(it.ko).then(found => { if (found && S.list && S.list[S.i] && S.list[S.i].ko === it.ko && !recState) renderSpeak(msg); });
  $("sBox").innerHTML = `<div class="qcard">
    <p class="hint" style="margin:0">${t("speakIntro")}</p>
    <div class="snav"><button class="btn ghost" id="sPrev" ${S.i === 0 ? "disabled" : ""} aria-label="Previous">◀</button><b>${S.i + 1} / ${list.length}</b><button class="btn ghost" id="sNext" ${S.i >= list.length - 1 ? "disabled" : ""} aria-label="Next">▶</button></div>
    <div class="sbig" lang="ko">${esc(it.ko)}</div>
    ${tr ? `<div class="strl">${esc(tr)}</div>` : ""}
    <span class="lbl">${t("speed")}</span>
    <div class="speeds" id="sSpeeds">${[0.3, 0.5, 0.7, 0.9, 1].map((r, k) => `<button class="sp" data-r="${r}" aria-pressed="${r === rate}">${r}×<small>${t("sp" + (k + 1))}</small></button>`).join("")}</div>
    <div class="dgrid">
      <button class="btn ghost" id="sLector">${t("lector")}</button>
      <button class="btn recbtn${recState ? " on" : ""}" id="sRec">${recState ? t("stop") : t("rec")}</button>
      <button class="btn ghost" id="sMine" ${has ? "" : "disabled"}>${t("mine")}</button>
      <button class="btn ghost" id="sComp" ${has ? "" : "disabled"}>${t("compare")}</button>
    </div>
    <div class="fb${msg === t("micErr") || msg === t("noRec") ? " bad" : ""}" id="sMsg">${msg ? esc(msg) : ""}</div>
  </div>`;
  S.list = list;
}
async function startRec() {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return renderSpeak(t("micErr"));
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return renderSpeak(t("micErr")); }
  const key = recKey(S.list[S.i].ko), chunksA = [];
  const mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data.size) chunksA.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    if (chunksA.length) {
      const blob = new Blob(chunksA, { type: mr.mimeType || "audio/webm" });
      if (recs.has(key)) URL.revokeObjectURL(recs.get(key));
      recs.set(key, URL.createObjectURL(blob));
      idb("readwrite", st => st.put(blob, key));
    }
    recState = null; renderSpeak(t("recDone"));
  };
  recState = { mr, stream, t0: Date.now() };
  mr.start();
  renderSpeak(t("recording", 0));
  recState.timer = setInterval(() => {
    if (!recState) return;
    const sec = Math.floor((Date.now() - recState.t0) / 1000);
    if ($("sMsg")) $("sMsg").textContent = t("recording", sec);
    if (sec >= 20) stopRec();
  }, 250);
}
function stopRec() { if (recState) { clearInterval(recState.timer); try { recState.mr.stop(); } catch (e) { recState = null; } } }
let audioEl = null;
function playMine() {
  return new Promise(res => {
    const url = recs.get(recKey(S.list[S.i].ko)); if (!url) { renderSpeak(t("noRec")); return res(); }
    if (audioEl) audioEl.pause();
    audioEl = new Audio(url); audioEl.onended = res; audioEl.onerror = res;
    audioEl.play().catch(res);
  });
}
$("sBox").addEventListener("click", async e => {
  const sp = e.target.closest(".sp");
  if (sp) { setRate(parseFloat(sp.dataset.r)); try { setPmin(pmin); } catch (er) {} const it = S.list && S.list[S.i]; if (it) { stop(); speakKo(it.ko); } return; }
  const id = e.target.closest("button")?.id; if (!id || !S.list) return;
  const it = S.list[S.i];
  if (id === "sPrev" || id === "sNext") { stopRec(); stop(); S.i += id === "sNext" ? 1 : -1; renderSpeak(); return; }
  if (id === "sLector") { stop(); speakKo(it.ko); }
  if (id === "sRec") { stop(); recState ? stopRec() : startRec(); }
  if (id === "sMine") { stop(); playMine(); }
  if (id === "sComp") { stop(); await speakKo(it.ko); await wait(400); playMine(); }
});

/* ---------- start ---------- */
lines = SAMPLE.map(([page, text]) => ({ page, text }));
orig = SAMPLE.length ? samplePdf() : null;
setRate(rate);
loadTr();
try { applyUI(); } catch (e) { console.error(e); }
setPmin(pmin);
setMode("orig");
initLibrary();
// links like …#dictation open the right place (used by the KWS checklist)
function route() {
  const h = location.hash.slice(1);
  if (!h) return;
  if (!$("viewer").hidden) closeViewer();
  if (!$("sheet").hidden) $("closeSet").click();
  if (h === "original") setMode("orig");
  else if (h === "listen") setMode("list");
  else if (h === "spelling" || h === "dictation" || h === "speaking") { setMode("quiz"); showPractice(h === "spelling" ? "quiz" : h === "dictation" ? "dict" : "speak"); }
  else if (h === "library") { setMode("orig"); window.scrollTo({ top: 0 }); $("lessonSel").focus(); }
  else if (h === "voices") openSet();
}
window.addEventListener("hashchange", route);
route();
// offline: when KWS is opened from a web address (e.g. GitHub Pages), keep the app and its libraries on the phone
if (/^https?:$/.test(location.protocol) && "serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
